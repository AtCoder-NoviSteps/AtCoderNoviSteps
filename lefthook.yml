version: 2

pre-commit:
  parallel: true
  jobs:
    - name: format
      # Without the flag, oxfmt exits 2 when every staged file is ignored (e.g. prisma/ERD.md)
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      glob: '**/*.{js,jsx,ts,tsx,md,svelte}'

    - name: oxlint
      run: pnpm exec oxlint {staged_files}
      glob: '**/*.{js,jsx,ts,tsx}'

    - name: eslint
      run: pnpm exec eslint {staged_files}
      glob: '**/*.svelte'

    - name: plan-lambda-check
      run: >
        if grep -nE '\([a-z]\)\s*(=>|:)' -- {staged_files}; then
          echo "Error: single-char lambda/type parameters found in plan code blocks. Rename to full domain concept (workbook, placement, group, ...)";
          exit 1;
        fi
      glob: 'docs/**/*.md'
